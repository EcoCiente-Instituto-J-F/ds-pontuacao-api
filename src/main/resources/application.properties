spring.application.name=pontuacao
app.security.jwt.secret=${JWT_SECRET}
server.port=9786

springdoc.swagger-ui.path =/swagger-ui/index.html

spring.config.import=optional:file:.env[.properties]

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.timezone=America/Sao_Paulo
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s

# Ciclos do ranking
app.ranking.cycle-epoch=${RANKING_CYCLE_EPOCH}
app.ranking.retention-days=90

# Sincronização
app.ranking.sync-delay-ms=5000
app.ranking.sync-batch-size=100

spring.data.redis.repositories.enabled=false

# Fechamento das janelas de validacao
app.validation.batch-size=100
app.validation.delay-ms=60000

# Health e metricas
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=true
management.health.db.enabled=true
